<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14221A"/>
      <stop offset="100%" stop-color="#070A0D"/>
    </radialGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10E760"/>
      <stop offset="100%" stop-color="#C8F845"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Chassis -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10E760" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Concentric Radar Sweep Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10E760" stroke-width="3" stroke-opacity="0.15"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10E760" stroke-width="3" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#10E760" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Radar Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#10E760" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8,8"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#10E760" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8,8"/>
  
  <!-- Radar Sector Sweep Beam -->
  <path d="M 256 256 L 390 120 A 190 190 0 0 0 256 66 Z" fill="url(#limeGrad)" opacity="0.35"/>
  
  <!-- Central Signal Hub -->
  <circle cx="256" cy="256" r="28" fill="url(#limeGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="12" fill="#070A0D"/>
  <circle cx="256" cy="256" r="6" fill="#10E760"/>
  
  <!-- Active Target Signal Blip -->
  <circle cx="340" cy="180" r="10" fill="#0DF0A0" filter="url(#glow)"/>
</svg>
